[package]
name = "PLFuzz"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.89"
config = "0.15.18"
paste = "1.0.15"
rand = "0.9.2"
reqwest = { version = "0.12.24", features = ["json"] }
rustdoc-types = "0.57.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["full"] }
tracing = "0.1.41"
tracing-appender = "0.2.3"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt", "json"] }
trustfall = "0.8.1"
trustfall-rustdoc-adapter = { version = "56.2.0", path = "../trustfall-rustdoc-adapter" }

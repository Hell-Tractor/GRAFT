[package]
name = "graft"
version = "0.1.0"
edition = "2024"
default-run = "graft"

[dependencies]
async-trait = "0.1.89"
clap = { version = "4.5.53", features = ["derive"] }
config = "0.15.18"
indicatif = "0.18.3"
paste = "1.0.15"
rand = "0.9.2"
reqwest = { version = "0.12.24", features = ["json"] }
rustdoc-types = "0.56.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
syn = { version = "2", features = ["full", "visit", "visit-mut"] }
quote = "1"
sha2 = "0.10"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["full"] }
tracing = "0.1.41"
tracing-appender = "0.2.3"
tracing-indicatif = "0.3.14"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt", "json", "registry"] }
trustfall = "0.8.1"
trustfall-rustdoc-adapter = { version = "56.2.0", path = "../../trustfall-rustdoc-adapter" }

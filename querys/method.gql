{
    Crate {
        item {
            ... on Struct {
                __typename @output(name: "item_type")
                name @output(name: "struct_name")
                span {
                    filename @output(name: "file")
                    begin_line @output(name: "line" )
                }
                canonical_path {
                    # used only when there is no public importable_path
                    path @output(name: "canonical_path")
                }
                importable_path @fold {
                    public_api @filter(op: "=", value: ["$public"])
                    deprecated @filter(op: "=", value: ["$deprecated"])
                    path @output(name: "module_path")
                }
                generic_parameter @fold {
                    ... on GenericTypeParameter {
                        name @output(name: "struct_generic_type_param_name")
                        type_bound @fold {
                            instantiated_name @output(name: "struct_type_bound_name")
                        }
                    }
                }
                impl {
                    method {
                        docs @output(name: "doc_comment")
                        public_api_eligible @filter(op: "=", value: ["$public"])
                        signature @output(name: "signature")
                        name @output(name: "name")
                        deprecated @filter(op: "=", value: ["$deprecated"])
                        generic_parameter @fold {
                            ... on GenericTypeParameter {
                                name @output(name: "generic_type_param_name")
                                type_bound @fold {
                                    instantiated_name @output(name: "type_bound_name")
                                }
                            }
                        }
                        parameter @fold {
                            name @output(name: "param_name")
                            json_type @output(name: "param_type")
                        }
                        return_value {
                            json_type @output(name: "return_type")
                        }
                    }
                }
            }
        }
    }
}
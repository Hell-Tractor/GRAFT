{
    Crate {
        item {
            ... on Constant {
                name @output(name: "constant_name")
                id @output(name: "id")
                docs @output(name: "constant_docs")
                public_api_eligible @filter(op: "=", value: ["$public"])
                deprecated @filter(op: "=", value: ["$deprecated"])
                canonical_path {
                    # used only when there is no public importable_path
                    path @output(name: "canonical_path")
                }
                importable_path @fold {
                    public_api @filter(op: "=", value: ["$public"])
                    deprecated @filter(op: "=", value: ["$deprecated"])
                    path @output(name: "importable_path")
                }
                raw_type @output(name: "raw_type")
            }
        }
    }
}